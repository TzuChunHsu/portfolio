<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" font-family="'Trebuchet MS', Verdana, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#cfcfcf"/>
    </marker>
    <style>
      .node { fill: #1f2326; stroke: #cfcfcf; stroke-width: 1.2; }
      .hub { fill: #1f2326; stroke: #56d364; stroke-width: 1.6; }
      .t { fill: #ececec; font-size: 17px; text-anchor: middle; }
      .s { fill: #9aa3a8; font-size: 13px; text-anchor: middle; }
      .edge { fill: none; stroke: #cfcfcf; stroke-width: 1.3; marker-end: url(#arrow); }
      .both { marker-start: url(#arrow); }
      .lbl rect { fill: #565b5f; }
      .lbl text { fill: #e2e2e2; font-size: 13px; text-anchor: middle; }
    </style>
  </defs>
  <rect width="1000" height="480" fill="#2b2f33"/>

  <!-- inputs -->
  <rect class="node" x="30" y="60" width="200" height="62" rx="2"/>
  <text class="t" x="130" y="89">Count sheets</text><text class="s" x="130" y="109">Word · Excel · ODT</text>
  <rect class="node" x="30" y="209" width="200" height="62" rx="2"/>
  <text class="t" x="130" y="238">Hospital data</text><text class="s" x="130" y="258">CSV templates</text>
  <rect class="node" x="30" y="358" width="200" height="62" rx="2"/>
  <text class="t" x="130" y="387">Barcode scanners</text><text class="s" x="130" y="407">SPD &amp; OR staff</text>

  <!-- tools -->
  <rect class="hub" x="360" y="60" width="230" height="62" rx="2"/>
  <text class="t" x="475" y="89">Count Sheet Converter</text><text class="s" x="475" y="109">Python · validation · audit report</text>
  <rect class="hub" x="360" y="209" width="230" height="62" rx="2"/>
  <text class="t" x="475" y="238">Data Import Tool</text><text class="s" x="475" y="258">PHP · 13 data types</text>

  <!-- platform -->
  <rect class="node" x="730" y="170" width="240" height="140" rx="2"/>
  <text class="t" x="850" y="225">CaseTrak360</text>
  <text class="s" x="850" y="247">Laravel · Vue.js · MySQL</text>
  <text class="s" x="850" y="267">instrument tracking</text>
  <rect class="node" x="760" y="370" width="180" height="50" rx="2"/>
  <text class="t" x="850" y="400">Pusher</text>

  <!-- edges -->
  <path class="edge" d="M230 91H358"/>
  <path class="edge" d="M475 122V207"/>
  <path class="edge" d="M230 240H358"/>
  <path class="edge" d="M590 240H728"/>
  <path class="edge" d="M230 389C470 389 560 300 728 290"/>
  <path class="edge both" d="M850 312V368"/>

  <!-- edge labels -->
  <g class="lbl"><rect x="266" y="80" width="56" height="22"/><text x="294" y="96">parse</text></g>
  <g class="lbl"><rect x="430" y="153" width="90" height="22"/><text x="475" y="169">CSV package</text></g>
  <g class="lbl"><rect x="270" y="229" width="48" height="22"/><text x="294" y="245">CSV</text></g>
  <g class="lbl"><rect x="620" y="229" width="78" height="22"/><text x="659" y="245">seeders</text></g>
  <g class="lbl"><rect x="420" y="352" width="56" height="22"/><text x="448" y="368">scan</text></g>
  <g class="lbl"><rect x="860" y="329" width="84" height="22"/><text x="902" y="345">real-time</text></g>
</svg>
