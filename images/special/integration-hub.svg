<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" font-family="'Trebuchet MS', Verdana, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#cfcfcf"/>
    </marker>
    <style>
      .node { fill: #1f2326; stroke: #cfcfcf; stroke-width: 1.2; }
      .hub { fill: #1f2326; stroke: #56d364; stroke-width: 1.6; }
      .t { fill: #ececec; font-size: 17px; text-anchor: middle; }
      .s { fill: #9aa3a8; font-size: 13px; text-anchor: middle; }
      .edge { fill: none; stroke: #cfcfcf; stroke-width: 1.3; marker-end: url(#arrow); }
      .lbl rect { fill: #565b5f; }
      .lbl text { fill: #e2e2e2; font-size: 13px; text-anchor: middle; }
    </style>
  </defs>
  <rect width="1000" height="480" fill="#2b2f33"/>

  <!-- sources -->
  <rect class="node" x="30" y="70" width="210" height="62" rx="2"/>
  <text class="t" x="135" y="99">SuiteCRM</text><text class="s" x="135" y="119">MySQL database</text>
  <rect class="node" x="30" y="209" width="210" height="62" rx="2"/>
  <text class="t" x="135" y="238">CRM history</text><text class="s" x="135" y="258">CSV exports</text>
  <rect class="node" x="30" y="348" width="210" height="62" rx="2"/>
  <text class="t" x="135" y="377">Legacy K2 site</text><text class="s" x="135" y="397">SQL dump</text>

  <!-- python services -->
  <rect class="hub" x="395" y="70" width="220" height="62" rx="2"/>
  <text class="t" x="505" y="99">FastAPI Sync Service</text><text class="s" x="505" y="119">APScheduler · every 12 h</text>
  <rect class="hub" x="395" y="278" width="220" height="62" rx="2"/>
  <text class="t" x="505" y="307">Python Migration CLIs</text><text class="s" x="505" y="327">dry-run · dedupe · reports</text>

  <!-- targets -->
  <rect class="node" x="760" y="70" width="210" height="62" rx="2"/>
  <text class="t" x="865" y="99">ActiveCampaign</text><text class="s" x="865" y="119">marketing CRM</text>
  <rect class="node" x="760" y="209" width="210" height="62" rx="2"/>
  <text class="t" x="865" y="238">Odoo</text><text class="s" x="865" y="258">ERP activities</text>
  <rect class="node" x="760" y="348" width="210" height="62" rx="2"/>
  <text class="t" x="865" y="377">Joomla 6</text><text class="s" x="865" y="397">website articles</text>

  <!-- edges -->
  <path class="edge" d="M240 101H393"/>
  <path class="edge" d="M615 101H758"/>
  <path class="edge" d="M240 240C320 240 320 300 393 304"/>
  <path class="edge" d="M240 379C320 379 320 320 393 316"/>
  <path class="edge" d="M615 300C690 296 690 240 758 240"/>
  <path class="edge" d="M615 318C690 322 690 379 758 379"/>

  <!-- edge labels -->
  <g class="lbl"><rect x="292" y="90" width="48" height="22"/><text x="316" y="106">SQL</text></g>
  <g class="lbl"><rect x="660" y="90" width="56" height="22"/><text x="688" y="106">REST</text></g>
  <g class="lbl"><rect x="290" y="252" width="48" height="22"/><text x="314" y="268">CSV</text></g>
  <g class="lbl"><rect x="290" y="338" width="48" height="22"/><text x="314" y="354">SQL</text></g>
  <g class="lbl"><rect x="650" y="252" width="76" height="22"/><text x="688" y="268">XML-RPC</text></g>
  <g class="lbl"><rect x="660" y="338" width="56" height="22"/><text x="688" y="354">REST</text></g>
</svg>
